[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-validator"
version = "0.1.0a1"
description = "Benchmark-driven multi-database search-strategy validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.scripts]
search-validator = "search_validator.cli:main"

[tool.setuptools.packages.find]
include = ["search_validator*"]
